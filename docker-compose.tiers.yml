# Tier-segregated second instance (see docs/provider-tiers.md).
#
#   freellmapi        (docker-compose.yml)  -> gray tier, host :3001 (existing)
#   freellmapi-clean  (this file)           -> Tier A only, host :3003
#
# Run both:
#   docker compose -f docker-compose.yml -f docker-compose.tiers.yml up -d
#
# Setup used here: the clean instance's volume is a CLONE of the gray
# instance's (all keys pre-configured, same ENCRYPTION_KEY — .env.clean is a
# copy of .env plus CLEAN_PORT), then non-Tier-A platforms are disabled in the
# clean DB (api_keys.enabled=0). docker/tiers/*.config.example.json remain as
# the from-scratch alternative via FREEAPI_CONFIG_PATH.
services:
  freellmapi-clean:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.clean
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "${HOST_BIND:-127.0.0.1}:${CLEAN_PORT:-3003}:3001"
    volumes:
      - freellmapi-clean-data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-clean-data:
