# Tier-segregated second instance (see docs/provider-tiers.md).
#
#   freellmapi        (docker-compose.yml)  -> gray tier, host :3001 (existing)
#   freellmapi-clean  (this file)           -> Tier A only, host :3003
#
# Run both:
#   docker compose -f docker-compose.yml -f docker-compose.tiers.yml up -d
#
# One-time setup for the clean instance:
#   cp docker/tiers/clean.config.example.json docker/tiers/clean.config.json
#   cp .env.clean.example .env.clean            # fresh ENCRYPTION_KEY, real keys
# The declarative config is applied idempotently on every boot. NOTE: a key
# entry OVERWRITES any key stored via the dashboard for that platform — either
# keep real keys in clean.config.json, or remove the entry after first boot
# and manage the key from the dashboard.
services:
  freellmapi-clean:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.clean
    environment:
      NODE_ENV: production
      PORT: 3001
      FREEAPI_CONFIG_PATH: /app/server/data/clean.config.json
    ports:
      - "${HOST_BIND:-127.0.0.1}:${CLEAN_PORT:-3003}:3001"
    volumes:
      - freellmapi-clean-data:/app/server/data
      - ./docker/tiers/clean.config.json:/app/server/data/clean.config.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-clean-data:
